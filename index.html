<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет разработчика</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid #30363d;
        }
        .cabinet-container {
            width: 100%;
            max-width: 800px;
            background-color: #161b22;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        input[type="password"] {
            padding: 10px;
            width: 80%;
            margin-bottom: 15px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            border-radius: 4px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2ea043; }
        .error { color: #ff7b72; margin-top: 10px; font-size: 14px; }
        pre {
            background: #0d1117;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #30363d;
            overflow-x: auto;
            text-align: left;
        }
        code {
            color: #e6edf3;
            font-family: monospace;
            font-size: 14px;
            white-space: pre;
        }
        h2, h3 { margin-top: 0; }
    </style>
</head>
<body>

    <!-- ОКНО АВТОРИЗАЦИИ -->
    <div class="login-container" id="loginBox">
        <h2>Личный кабинет</h2>
        <p>Введите пароль для доступа к кодам ботов:</p>
        <input type="password" id="passwordInput" placeholder="Пароль">
        <br>
        <button onclick="checkPassword()">Войти</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <!-- СКРЫТЫЙ СЕКРЕТНЫЙ КАБИНЕТ -->
    <div class="cabinet-container" id="secretContent" style="display: none;">
        <h2 style="color: #2ea043;">🔓 Добро пожаловать в пульт управления!</h2>
        <p style="color: #8b949e;">Это ваш личный секретный сайт с исходным кодом Telegram-ботов.</p>
        
        <h3 style="color: #58a6ff; margin-top: 25px;">💻 Полный код моих Telegram-ботов (Python)</h3>
        <pre><code id="codeBlock"># -*- coding: utf-8 -*-
</code></pre>
    </div>

    <!-- СКРИПТ ПРОВЕРКИ ПАРОЛЯ -->
    <script>
        function checkPassword() {
            let password = document.getElementById("passwordInput").value;
            let correctPassword = "1234";

            if (password === correctPassword) {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("secretContent").style.display = "block";
                document.body.style.backgroundColor = "#0d1117";
                document.body.style.alignItems = "flex-start";
            } else {
                document.getElementById("errorMsg").innerText = "❌ Неверный пароль!";
            }
        }
    </script>
</body>
</html>
