<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход на сайт</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        input [type="password"] {
            padding: 10px;
            width: 80%;
            margin-bottom: 15px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #2ea043; }
        .error { color: #ff7b72; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-container" id="loginBox">
    <h2>Личный кабинет</h2>
    <p>Введите пароль для доступа к сайту:</p>
    <input type="password" id="passwordInput" placeholder="Пароль">
    <br>
    <button onclick="checkPassword()">Войти</button>
    <div class="error" id="errorMsg"></div>
</div>

<div id="secretContent" style="display: none; padding: 20px;">
    <!-- СЮДА ВСТАВЛЯЙТЕ ВСЁ, ЧТО ХОТИТЕ ВИДЕТЬ НА СВОЁМ САЙТЕ -->
    <h1>Добро пожаловать!</h1>
    <p>Это ваш личный секретный сайт, доступный только вам.</p>
</div>

<script>
function checkPassword() {
    let password = document.getElementById("passwordInput").value;
    // ЗАМЕНИТЕ "1234" НА ВАШ СЕКРЕТНЫЙ ПАРОЛЬ
    let correctPassword = "1234"; 

    if (password === correctPassword) {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("secretContent").style.display = "block";
        document.body.style.backgroundColor = "#0d1117"; 
    } else {
        document.getElementById("errorMsg").innerText = "Неверный пароль!";
    }
}
</script>

</body>
</html>
